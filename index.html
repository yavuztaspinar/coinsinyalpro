<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BalinaSavar Pro</title>
    <style>
        :root { --gold-btn: #fcd535; --border: #eaecef; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #ffffff; }
        
        /* Giriş Ekranı */
        #login-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
        #login-overlay input { padding: 12px; width: 280px; border: 1px solid #ccc; border-radius: 8px; }
        #login-overlay button { padding: 12px 30px; background: var(--gold-btn); border: none; cursor: pointer; font-weight: bold; border-radius: 8px; }
        
        /* İçerik */
        #protected-content { display: none; }
        .main-navbar { width: 100%; background-color: #1e2329; height: 70px; display: flex; align-items: center; padding: 0 20px; color: #fcd535; font-weight: 800; }
        .scanner-box { width: 95%; max-width: 1560px; margin: 30px auto; padding: 35px; border: 2px solid var(--border); border-radius: 16px; }
        table { width: 100%; border-collapse: collapse; display: none; margin-top: 20px; }
        th, td { padding: 18px; border-bottom: 2px solid var(--border); text-align: left; }
    </style>
</head>
<body>

<!-- GİRİŞ PANELİ -->
<div id="login-overlay">
    <h2>🎯 BALİNASAVAR PRO // GİRİŞ</h2>
    <input type="email" id="email" placeholder="E-posta">
    <input type="password" id="password" placeholder="Şifre">
    <button id="login-btn">Giriş Yap</button>
    <p id="message" style="color: red;"></p>
</div>

<!-- PANEL -->
<div id="protected-content">
    <nav class="main-navbar">🎯 BALİNASAVAR PRO</nav>
    <div class="scanner-box">
        <h2>Dip Uyumsuzluk Avcısı</h2>
        <select id="tf"><option value="1h">1 Saat</option><option value="4h">4 Saat</option></select>
        <button onclick="huntCombinations()">Avı Başlat</button>
        <p id="status">Sistem hazır.</p>
        <table id="table"><tbody id="list"></tbody></table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCfez-GuBL-_jJ_uCYq9tRYouF9Dcs-l6o",
        authDomain: "coinsinyalpro.firebaseapp.com",
        projectId: "coinsinyalpro",
        storageBucket: "coinsinyalpro.firebasestorage.app",
        messagingSenderId: "1015200348139",
        appId: "1:1015200348139:web:28a326c20b8a6f7b08cbae"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Onay Kontrolü
    async function checkApproval(email) {
        const docRef = doc(db, "onayli_kullanicilar", email);
        const docSnap = await getDoc(docRef);
        return docSnap.exists();
    }

    // Giriş Butonu
    document.getElementById("login-btn").addEventListener("click", async () => {
        const e = document.getElementById("email").value;
        const p = document.getElementById("password").value;
        try {
            await signInWithEmailAndPassword(auth, e, p);
        } catch (err) {
            document.getElementById("message").innerText = "Giriş hatası: Bilgileri kontrol edin.";
        }
    });

    // Oturum Kontrolü
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const isApproved = await checkApproval(user.email);
            if (isApproved) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('protected-content').style.display = 'block';
            } else {
                alert("Hesabınız onaylanmamış! Çıkış yapılıyor.");
                await signOut(auth);
                location.reload();
            }
        }
    });
</script>

<script>
    function huntCombinations() {
        document.getElementById('table').style.display = 'table';
        document.getElementById('status').innerText = 'Av başladı, veriler taranıyor...';
    }
</script>

</body>
</html>
