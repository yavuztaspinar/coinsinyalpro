<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BalinaSavar Pro - Dip Uyuşmazlık Avcısı</title>
    <style>
        :root {
            --bg: #ffffff;       
            --card: #f8f9fa;     
            --text: #1e2329;     
            --text-muted: #5e6673;
            --gold: #c79d00;     
            --gold-hover: #b08b00;
            --gold-btn: #fcd535;
            --green: #0ecb81;
            --red: #f6465d;
            --blue: #2f80ed;
            --border: #eaecef;   
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px 0 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .scanner-box {
            width: 100%;
            max-width: 1560px;
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            box-sizing: border-box;
        }
        h2 { 
            text-align: center; 
            color: var(--text); 
            margin-top: 0; 
            font-size: 28px; 
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .grid-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            background: #f1f3f5; 
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
        select, input, button {
            padding: 14px;
            background: #ffffff;
            border: 1px solid #cdc1c1;
            color: var(--text); 
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }
        select:focus, input:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(199, 157, 0, 0.2); }
        button {
            background: var(--gold-btn);
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }
        button:hover { background: #f3ba2f; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(243, 186, 47, 0.3); }
        button:disabled { background: #e9ecef; color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }
        .status-panel {
            text-align: center;
            margin: 30px 0;         
            font-weight: 700;
            font-size: 18px;
        }
        .bar-container {
            width: 100%;
            background: #e9ecef;
            height: 10px;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }
        .bar-inner { width: 0%; height: 100%; background: var(--gold); transition: width 0.1s ease-out; }
        
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 25px;
            -webkit-overflow-scrolling: touch;
        }
        table { width: 100%; border-collapse: collapse; display: none; background: #ffffff; min-width: 1200px; }
        th, td { padding: 18px 14px; text-align: left; border-bottom: 2px solid var(--border); font-size: 15px; }
        th { background: #e9ecef; color: var(--text); font-size: 14px; font-weight: 700; text-transform: uppercase; } 
        .match-row { background: #ffffff; animation: fadeIn 0.3s ease-in-out; } 
        .match-row:hover { background: #f8f9fa; } 
        .badge { padding: 6px 12px; border-radius: 6px; font-size: 13px; margin-right: 4px; display: inline-block; font-weight: 700; }
        .badge-confirm { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 700; }
        .badge-strong-confirm { background: rgba(142, 68, 173, 0.15); color: #8e44ad; border: 1px solid #8e44ad; }
        .badge-weak-confirm { background: rgba(127, 140, 141, 0.15); color: #7f8c8d; border: 1px solid #7f8c8d; }
        .badge-trade { font-size: 14px; letter-spacing: 0.5px; border: 1px solid transparent; width: 70px; text-align: center; }
        .trade-buy { background: rgba(14, 203, 129, 0.15); color: #0db372; border-color: var(--green); }
        .trade-sell { background: rgba(246, 70, 93, 0.15); color: #df334a; border-color: var(--red); }
        .trade-hold { background: rgba(132, 142, 156, 0.15); color: var(--text-muted); border-color: var(--text-muted); }
        .large-numeric { font-family: 'Courier New', Courier, monospace; font-size: 17px; font-weight: 700; color: #000; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="scanner-box">
    <h2>🎯 BALİNASAVAR PRO // DİP UYUMSUZLUK AVCISI</h2>
    <div class="grid-controls">
        <div class="input-group">
            <label>Veri Kaynağı Modu</label>
            <select id="sourceMode">
                <option value="binance" selected>Binance Canlı Matris</option>
            </select>
        </div>
        <div class="input-group">
            <label>Zaman Periyodu</label>
            <select id="tf">
                <option value="15m">15 Dakika (Hızlı)</option>
                <option value="1h" selected>1 Saat (Önerilen)</option>
                <option value="4h">4 Saat (Güçlü Trend)</option>
                <option value="1d">1 Gün (Makro)</option>
            </select>
        </div>
        <div class="input-group" id="filterGroup">
            <label id="filterLabel">24s Hacim Filtresi</label>
            <select id="filterChoice">
                <option value="all">Tümünü Tara (Sınır Yok)</option>
                <option value="100k-500k">100k - 500k USDT</option>
                <option value="500k-2m">500k - 2M USDT</option>
                <option value="2m-all" selected>2M USDT ve Üzeri (Güvenli)</option>
            </select>
        </div>
        <div class="input-group">
            <label>Aşırı Satım Sınırı (RSI)</label>
            <select id="limit">
                <option value="35">RSI 35 Altı</option>
                <option value="30" selected>RSI 30 Altı</option>
                <option value="25">RSI 25 Altı</option>
            </select>
        </div>
        <div class="input-group">
            <label>Tarama Algoritması</label>
            <select id="strategyMode">
                <option value="all" selected>Tüm Sinyal ve Dipler</option>
                <option value="reversal">Sadece Dönüş & Uyuşmazlık</option>
                <option value="pure_dip">Sadece Mutlak Diptekiler</option>
            </select>
        </div>
        <div class="input-group" style="justify-content: flex-end;">
            <button id="btn" onclick="huntCombinations()">Avı Başlat</button>
        </div>
    </div>

    <div class="status-panel">
        <span id="info">Sistem hazır. Canlı matris bağlantısı bekleniyor...</span>
        <div id="barBg" class="bar-container"><div id="bar" class="bar-inner"></div></div>
    </div>

    <div class="table-responsive">
        <table id="table">
            <thead>
                <tr>
                    <th>Parite</th>
                    <th>24s Hacim</th>
                    <th>Arz Riski</th>
                    <th>Sinyal Durumu</th>
                    <th>Onay</th>
                    <th>MA Trend Kesişim</th>
                    <th>Karar</th>
                    <th>RSI</th>
                    <th>MACD</th>
                    <th>Hacim MA</th>
                    <th>VWMA Durumu</th>
                    <th>Dip Mesafe</th>
                    <th>Anlık Fiyat</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>
</div>

<script>
    let backupCryptoMatrix = [];

    const riskliArzListesi = {
        "STRK": { risk: "KİLİT AÇILIMI", detay: "Her ayın 15'inde kilit açılımı baskısı.", maxArz: "Sınırlı" },
        "ZEC": { risk: "GİZLİ HAVUZ", detay: "Teknik arz takibi belirsiz.", maxArz: "21 Milyon" },
        "W": { risk: "ENFLASYON", detay: "Erken dönem kilit açılımları mevcut.", maxArz: "Yüksek Arz" }
    };

    async function entegreEtVeYukle() {
        try {
            document.getElementById("info").innerText = "⏳ Binance veri matrisi senkronize ediliyor...";
            const infoRes = await fetch('https://api.binance.com/api/v3/exchangeInfo');
            const infoData = await infoRes.json();

            let currentRank = 1;
            backupCryptoMatrix = infoData.symbols
                .filter(s => s.status === 'TRADING' && s.symbol.endsWith('USDT') && !s.symbol.includes("UP") && !s.symbol.includes("DOWN"))
                .map(s => {
                    return {
                        "rank": currentRank++,
                        "symbol": s.baseAsset,
                        "pair": s.symbol
                    };
                });
            document.getElementById("info").style.color = "var(--green)";
            document.getElementById("info").innerText = `✅ Bağlantı kuruldu! Toplam ${backupCryptoMatrix.length} adet canlı parite taramaya hazır.`;
        } catch (error) {
            console.error(error);
            document.getElementById("info").style.color = "var(--red)";
            document.getElementById("info").innerText = "❌ Binance API bağlantı hatası! Sayfayı yenileyin.";
        }
    }

    window.onload = function() {
        entegreEtVeYukle();
    };

    function calculateAllRSI(klines) {
        if (!klines || klines.length < 15) return [];
        let len = klines.length;
        let rsiValues = new Array(len).fill(null);
        let gains = [];
        let losses = [];
        
        for (let i = 1; i < len; i++) {
            let diff = parseFloat(klines[i][4]) - parseFloat(klines[i-1][4]);
            gains.push(diff > 0 ? diff : 0);
            losses.push(diff < 0 ? Math.abs(diff) : 0);
        }
        
        let sumGains = 0; let sumLosses = 0;
        for (let i = 0; i < 14; i++) {
            sumGains += gains[i];
            sumLosses += losses[i];
        }
        
        let avgGain = sumGains / 14;
        let avgLoss = sumLosses / 14;
        rsiValues[14] = avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
        
        for (let i = 14; i < gains.length; i++) {
            avgGain = (avgGain * 13 + gains[i]) / 14;
            avgLoss = (avgLoss * 13 + losses[i]) / 14;
            rsiValues[i + 1] = avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
        }
        return rsiValues;
    }

    function calculateEMA(data, period) {
        if (data.length < period) return new Array(data.length).fill(0);
        let k = 2 / (period + 1);
        let ema = new Array(data.length).fill(0);
        let sum = 0;
        for (let i = 0; i < period; i++) sum += data[i];
        ema[period - 1] = sum / period;
        for (let i = period; i < data.length; i++) {
            ema[i] = (data[i] * k) + (ema[i - 1] * (1 - k));
        }
        return ema;
    }

    function calculateSMA(data, period) {
        if (data.length < period) return new Array(data.length).fill(0);
        let sma = new Array(data.length).fill(0);
        let sum = 0;
        for (let i = 0; i < period; i++) sum += data[i];
        sma[period - 1] = sum / period;
        for (let i = period; i < data.length; i++) {
            sum = sum - data[i - period] + data[i];
            sma[i] = sum / period;
        }
        return sma;
    }

    function checkGoldenDeathCross(klines) {
        if (!klines || klines.length < 202) return { state: "Yetersiz Veri", isBullish: false, isBearish: false };
        let closePrices = klines.map(k => parseFloat(k[4]));
        let sma50 = calculateSMA(closePrices, 50);
        let sma200 = calculateSMA(closePrices, 200);
        let len = closePrices.length;
        
        if (sma50[len - 2] <= sma200[len - 2] && sma50[len - 1] > sma200[len - 1]) return { state: "🌟 GOLDEN CROSS", isBullish: true, isBearish: false };
        if (sma50[len - 2] >= sma200[len - 2] && sma50[len - 1] < sma200[len - 1]) return { state: "💀 DEATH CROSS", isBullish: false, isBearish: true };
        return sma50[len - 1] > sma200[len - 1] ? { state: "📈 Boğa (SMA50>200)", isBullish: true, isBearish: false } : { state: "📉 Ayı (SMA50<200)", isBullish: false, isBearish: true };
    }

    function calculateMACD(klines) {
        if (!klines || klines.length < 35) return null;
        let closePrices = klines.map(k => parseFloat(k[4]));
        let ema12 = calculateEMA(closePrices, 12);
        let ema26 = calculateEMA(closePrices, 26);
        let macdLine = ema12.map((v, i) => v - ema26[i]);
        let signalLine = calculateEMA(macdLine, 9);
        let len = closePrices.length;
        return { macd: macdLine[len - 1], signal: signalLine[len - 1], prevMacd: macdLine[len - 2], prevSignal: signalLine[len - 2] };
    }

    function checkVolumeSpike(klines) {
        if (!klines || klines.length < 21) return null;
        let volumes = klines.map(k => parseFloat(k[5]));
        let currentVol = volumes[volumes.length - 1];
        let avgVol = volumes.slice(-21, -1).reduce((a, b) => a + b, 0) / 20;
        return { isSpike: currentVol > (avgVol * 1.25), ratio: avgVol === 0 ? "1.00" : (currentVol / avgVol).toFixed(2) };
    }

    function calculateHistoricalDip(klines) {
        if(!klines || klines.length < 30) return null;
        let currentPrice = parseFloat(klines[klines.length - 1][4]);
        let absoluteLow = Math.min(...klines.map(k => parseFloat(k[3])));
        let distanceToLow = ((currentPrice - absoluteLow) / (absoluteLow || 1)) * 100;
        return { isPureDip: distanceToLow <= 1.2, distance: distanceToLow.toFixed(2) };
    }

    function checkBullishDivergence(klines, rsiValues) {
        if (!klines || klines.length < 35 || rsiValues.length < 35) return { isDiv: false, rsiDiff: "0.00" };
        let len = klines.length;
        let currentLow = parseFloat(klines[len - 1][3]);
        let currentRSI = rsiValues[len - 1];
        if(currentRSI === null || currentRSI > 45) return { isDiv: false, rsiDiff: "0.00" };

        for(let i = len - 25; i < len - 4; i++) {
            let pastLow = parseFloat(klines[i][3]);
            let pastRSI = rsiValues[i];
            if(pastRSI !== null && currentLow < pastLow && currentRSI > pastRSI && pastRSI < 35) {
                return { isDiv: true, rsiDiff: (currentRSI - pastRSI).toFixed(2) };
            }
        }
        return { isDiv: false, rsiDiff: "0.00" };
    }

    function calculateVWMAAndCross(klines, period = 20) {
        if (!klines || klines.length < (period + 2)) return { state: "N/A", isBullish: false };
        let len = klines.length;
        const getVWMA = (offset) => {
            let pv = 0, v = 0, c = 0;
            for(let i=0; i<period; i++) {
                let k = klines[len - 1 - i - offset];
                let close = parseFloat(k[4]), vol = parseFloat(k[5]);
                pv += (close * vol); v += vol; c += close;
            }
            return { vwma: v === 0 ? 0 : pv / v, sma: c / period };
        };
        let cur = getVWMA(0), prev = getVWMA(1);
        if (prev.vwma <= prev.sma && cur.vwma > cur.sma) return { state: "🚀 Yukarı Kesişim", isBullish: true };
        return cur.vwma > cur.sma ? { state: "📈 Boğa Eğilimi", isBullish: true } : { state: "📉 Ayı Eğilimi", isBullish: false };
    }

    function generateTradeSignal(rsiNow, rsiPrev, macdData, volData, dipData, divData, rsiLimit, coinSymbol, vwmaData, crossData) {
        if (rsiNow === null) return { action: "BEKLE", class: "trade-hold", confirmed: false };
        const gun = new Date().getDate(); 
        if (coinSymbol === "STRK" && (gun >= 12 && gun <= 17)) return { action: "RİSK", class: "trade-sell", confirmed: false, isCustomReason: true, reason: "KİLİT RİSKİ" };
        
        const rsiDonusOnay = rsiPrev !== null && rsiNow > rsiPrev && (rsiPrev < (rsiLimit + 5)); 
        const macdConf = macdData && (macdData.macd > macdData.signal);
        const volConf = volData && volData.isSpike;
        const vwmaConf = vwmaData && vwmaData.isBullish;

        const isDivergenceBuy = (divData && divData.isDiv);
        const isReversalBuy = rsiDonusOnay && macdConf;
        const isDipBuy = (rsiNow <= rsiLimit && dipData && dipData.isPureDip && rsiNow > rsiPrev);
                                           
        if (isReversalBuy || isDipBuy || isDivergenceBuy) {
            let isFullyConfirmed = (macdConf && vwmaConf) || (isDivergenceBuy && (rsiNow > rsiPrev || volConf)) || (vwmaData && vwmaData.state.includes("🚀"));
            if (riskliArzListesi[coinSymbol] && !volConf) isFullyConfirmed = false; 
            return { action: "AL", class: "trade-buy", confirmed: isFullyConfirmed };
        }
        if ((rsiNow >= 72 && rsiPrev !== null && rsiNow < rsiPrev) || (rsiNow > 60 && macdData && macdData.macd < macdData.signal && macdData.prevMacd >= macdData.prevSignal)) {
            return { action: "SAT", class: "trade-sell", confirmed: true };
        }
        return { action: "BEKLE", class: "trade-hold", confirmed: false };
    }

    async function huntCombinations() {
        const btn = document.getElementById("btn");
        const tf = document.getElementById("tf").value;
        const filterChoice = document.getElementById("filterChoice").value;
        const rsiLimit = parseFloat(document.getElementById("limit").value);
        const strategyMode = document.getElementById("strategyMode").value;
        const info = document.getElementById("info");
        const barBg = document.getElementById("barBg");
        const bar = document.getElementById("bar");
        const table = document.getElementById("table");
        const list = document.getElementById("list");

        btn.disabled = true;
        table.style.display = "none";
        list.innerHTML = "";
        barBg.style.display = "block";
        bar.style.width = "0%";
        info.style.color = "var(--text)";
        let targets = [];

        try {
            info.innerText = "⚡ Canlı hacim verileri borsadan alınıyor...";
            const tickerRes = await fetch("https://api.binance.com/api/v3/ticker/24hr");
            if(!tickerRes.ok) throw new Error("Borsa veri akışı kesildi.");
            const tickerData = await tickerRes.json();

            let min = 0, max = Infinity;
            if(filterChoice === "100k-500k") { min = 100000; max = 500000; }
            else if(filterChoice === "500k-2m") { min = 500000; max = 2000000; }
            else if(filterChoice === "2m-all") { min = 2000000; }

            targets = backupCryptoMatrix.map(coin => {
                const ticker = tickerData.find(t => t.symbol === coin.pair);
                const quoteVol = ticker ? parseFloat(ticker.quoteVolume) : 0;
                return {
                    symbol: coin.pair,
                    pureSymbol: coin.symbol,
                    volume: quoteVol,
                    volumeText: new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(quoteVol),
                    price: ticker ? parseFloat(ticker.lastPrice) : 0
                };
            }).filter(coin => coin.volume >= min && coin.volume <= max);

            if (targets.length === 0) throw new Error("Filtreye uygun aktif parite bulunamadı.");

            // Hız limiti koruması için paket boyutu 8'e düşürüldü
            const chunkSize = 8; 

            for (let i = 0; i < targets.length; i += chunkSize) {
                const chunk = targets.slice(i, i + chunkSize);
                bar.style.width = `${((i + chunk.length) / targets.length) * 100}%`;
                info.innerText = `🔍 Tarama: %${Math.round(((i + chunk.length) / targets.length) * 100)} (${chunk[chunk.length - 1].pureSymbol})`;

                await Promise.all(chunk.map(async (coin) => {
                    try {
                        const kRes = await fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=${tf}&limit=250`);
                        if(!kRes.ok) return;
                        const klines = await kRes.json();
                        if(!klines || klines.length < 35) return;

                        let rsiValues = calculateAllRSI(klines);
                        let rsiNow = rsiValues[rsiValues.length - 1];
                        let rsiPrev = rsiValues[rsiValues.length - 2];
                        
                        let macdData = calculateMACD(klines);
                        let volData = checkVolumeSpike(klines);
                        let dipData = calculateHistoricalDip(klines);
                        let divData = checkBullishDivergence(klines, rsiValues);
                        let vwmaData = calculateVWMAAndCross(klines, 20);
                        let crossData = checkGoldenDeathCross(klines);
                        
                        let tradeSignal = generateTradeSignal(rsiNow, rsiPrev, macdData, volData, dipData, divData, rsiLimit, coin.pureSymbol, vwmaData, crossData);

                        let isReversal = (rsiPrev !== null && rsiNow !== null && rsiPrev < rsiLimit && rsiNow > rsiPrev);
                        let isPureDip = (rsiNow !== null && rsiNow <= rsiLimit && dipData && dipData.isPureDip);
                        let isDivActive = divData && divData.isDiv;

                        // Önemli Değişiklik: Eğer strateji Modu all (hepsi) ise filtreleri tamamen gevşetiyoruz
                        if (strategyMode === "reversal" && !isReversal && !isDivActive) return;
                        if (strategyMode === "pure_dip" && !isPureDip) return;
                        if (strategyMode === "all" && rsiNow > rsiLimit && !isDivActive && !isPureDip && tradeSignal.action !== "AL") return;

                        let signalType = "Yatay Trend";
                        if (isDivActive && isPureDip) signalType = "Uyuşmazlık + Dip";
                        else if (isDivActive) signalType = "Pozitif Uyuşmazlık";
                        else if (isReversal) signalType = "Dönüş Sinyali";
                        else if (isPureDip) signalType = "Mutlak Dip";

                        let arzBadge = `<span style="color:var(--text-muted); font-size:13px; font-weight:600;">Temiz</span>`;
                        if (riskliArzListesi[coin.pureSymbol]) {
                            arzBadge = `<span style="color:var(--red); font-size:13px; font-weight:bold;">⚠️ ${riskliArzListesi[coin.pureSymbol].risk}</span>`;
                        }

                        let onayRozeti = tradeSignal.isCustomReason ? 
                            `<span class="badge" style="color:#e67e22; background:rgba(230,126,34,0.12); border:1px solid #e67e22;">${tradeSignal.reason}</span>` : 
                            (tradeSignal.confirmed ? '<span class="badge badge-confirm badge-strong-confirm">GÜÇLÜ</span>' : '<span class="badge badge-confirm badge-weak-confirm">Zayıf</span>');

                        let vwmaColor = vwmaData.state.includes("🚀") ? "var(--green)" : (vwmaData.isBullish ? "#2fc787" : "var(--red)");
                        let crossColor = crossData.state.includes("GOLDEN") ? "var(--green)" : (crossData.state.includes("DEATH") ? "var(--red)" : (crossData.isBullish ? "#2fc787" : "#df334a"));

                        const row = document.createElement("tr");
                        row.className = "match-row";
                        row.innerHTML = `
                            <td><strong style="font-size:16px; color:#000;">${coin.symbol}</strong></td>
                            <td class="large-numeric" style="color:var(--text-muted);">${coin.volumeText}</td>
                            <td>${arzBadge}</td>
                            <td><span class="badge" style="background:rgba(199,157,0,0.1); color:var(--gold)">${signalType}</span></td>
                            <td>${onayRozeti}</td>
                            <td style="font-weight:700; color:${crossColor}">${crossData.state}</td>
                            <td><span class="badge badge-trade ${tradeSignal.class}">${tradeSignal.action}</span></td>
                            <td class="large-numeric" style="color:${rsiNow && rsiNow <= rsiLimit ? 'var(--green)' : 'var(--text)'}"><b>${rsiNow ? rsiNow.toFixed(2) : "N/A"}</b></td>
                            <td style="font-weight:700; color:${macdData && macdData.macd > macdData.signal ? '#0db372':'#df334a'}">${macdData ? (macdData.macd > macdData.signal ? '🐂 Boğa' : '🐻 Ayı') : "N/A"}</td>
                            <td class="large-numeric">${volData ? volData.ratio + "x" : "N/A"}</td>
                            <td style="font-weight:700; color:${vwmaColor}">${vwmaData.state}</td>
                            <td class="large-numeric" style="color:var(--blue)">%${dipData ? dipData.distance : "0.00"}</td>
                            <td class="large-numeric" style="color:#b08b00">$${coin.price.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:6})}</td>
                        `;
                        list.appendChild(row);
                    } catch (e) { console.error(e); }
                }));
                // API Rate Limit yememek için bekleme süresi 120ms yapıldı
                await new Promise(r => setTimeout(r, 120));
            }

            if(list.children.length === 0) {
                info.style.color = "var(--gold)";
                info.innerText = `⚠️ Tarama bitti fakat şu an piyasada seçtiğiniz RSI sınırında (${rsiLimit} altı) uygun dip/uyuşmazlık paritesi bulunamadı.`;
            } else {
                info.style.color = "var(--green)";
                info.innerText = `🎯 Tarama Başarıyla Tamamlandı! Toplam ${list.children.length} parite listelendi.`;
                table.style.display = "table";
            }

        } catch (error) {
            console.error(error);
            document.getElementById("info").style.color = "var(--red)";
            document.getElementById("info").innerText = "❌ Hata Oluştu: " + error.message;
        } finally {
            btn.disabled = false;
            barBg.style.display = "none";
        }
    }
</script>

</body>
</html>
