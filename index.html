<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Coin Sinyal Pro - Giriş</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #333; background: #252525; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #f0b90b; border: none; color: black; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:hover { background: #d8a60a; }
        .toggle-link { color: #aaa; font-size: 12px; margin-top: 15px; cursor: pointer; display: block; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="form-title">Giriş Yap</h2>
    <input type="email" id="email" placeholder="E-posta Adresi">
    <input type="password" id="password" placeholder="Şifre">
    <button id="auth-btn">Giriş Yap</button>
    <span class="toggle-link" id="toggle-form">Hesabın yok mu? Kayıt Ol</span>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // --- BURAYA KENDİ BİLGİLERİNİ YAPIŞTIR ---
  const firebaseConfig = {
    apiKey: "BURAYA_API_KEY",
    authDomain: "BURAYA_AUTH_DOMAIN",
    projectId: "BURAYA_PROJECT_ID",
    storageBucket: "BURAYA_STORAGE_BUCKET",
    messagingSenderId: "BURAYA_MESSAGING_SENDER_ID",
    appId: "BURAYA_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isLoginMode = true;
  const formTitle = document.getElementById("form-title");
  const authBtn = document.getElementById("auth-btn");
  const toggleForm = document.getElementById("toggle-form");

  toggleForm.addEventListener("click", () => {
    isLoginMode = !isLoginMode;
    formTitle.innerText = isLoginMode ? "Giriş Yap" : "Kayıt Ol";
    authBtn.innerText = isLoginMode ? "Giriş Yap" : "Kayıt Ol";
    toggleForm.innerText = isLoginMode ? "Hesabın yok mu? Kayıt Ol" : "Zaten hesabın var mı? Giriş Yap";
  });

  authBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(!email || !password) return alert("Lütfen boş alan bırakmayın.");

    if (isLoginMode) {
        signInWithEmailAndPassword(auth, email, password)
          .then(() => window.location.href = "sinyaller.html")
          .catch(err => alert("Giriş Hatası: " + err.message));
    } else {
        createUserWithEmailAndPassword(auth, email, password)
          .then(async (userCredential) => {
              await setDoc(doc(db, "kullanicilar", userCredential.user.uid), {
                  email: email,
                  onayli: false
              });
              alert("Kayıt başarılı! Yöneticinin onaylamasını bekleyin.");
          })
          .catch(err => alert("Kayıt Hatası: " + err.message));
    }
  });
</script>
</body>
</html>
