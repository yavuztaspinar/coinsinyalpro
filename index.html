<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kırılım Avcısı</title>
    <!-- CSS'i dosyanın içine gömdük (Dış dosyaya gerek kalmadı) -->
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f4f7fc; }
        .nav { background: #1e2329; color: #fcd535; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { max-width: 900px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #fcd535; border: none; padding: 12px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="nav">🎯 YAVUZ TAŞPINAR - KIRILIM AVCISI</div>

    <!-- İÇERİK -->
    <div class="container">
        <button onclick="calistir()">Avı Başlat</button>
        <div id="durum" style="margin-top:10px;">Sistem hazır.</div>
        
        <table id="tablo">
            <thead>
                <tr>
                    <th>Parite</th>
                    <th>Fiyat</th>
                </tr>
            </thead>
            <tbody id="sonucAlani">
                <!-- Veriler buraya gelecek -->
            </tbody>
        </table>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        function calistir() {
            document.getElementById("durum").innerText = "✅ Tarama yapılıyor...";
            
            // Buraya kendi mantığınızı veya verinizi koyun
            const sonucAlani = document.getElementById("sonucAlani");
            sonucAlani.innerHTML = "<tr><td>BTC/USDT</td><td>65.000$</td></tr>";
            
            document.getElementById("durum").innerText = "✅ Tarama tamamlandı.";
        }
    </script>

</body>
</html>
